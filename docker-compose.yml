services:
  django-langgraph:
    container_name: django-langgraph
    build:
      context: docker/python
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./django-langgraph:/app
    working_dir: /app
    ports:
      - "8001:8000"
    env_file:
      - django-langgraph/.env.local
    environment:
      - PYTHONUNBUFFERED=1
      - DJANGO_SETTINGS_MODULE=config.settings
