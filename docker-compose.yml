services:
  django-langgraph:
    build:
      context: .
      dockerfile: docker/python/Dockerfile
    volumes:
      - ./django-langgraph:/app
    container_name: django-langgraph
    env_file:
      - ./django-langgraph/.env.local
    environment:
      APP_ENV: development
      PORT: 8001
    ports:
      - "8001:8001"
    restart: unless-stopped
